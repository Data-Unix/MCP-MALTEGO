name: PR Security & Architecture Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assess:
    name: Security Scan & Blast Radius
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run AST Security & Blast Radius Analysis
        run: |
          uv run python scripts/analyze_pr.py --base "origin/${{ github.base_ref || 'main' }}" --output pr-report.md

      - name: Verify 20 Tools & Schema Portability
        run: |
          uv run pytest -q tests/test_schema_portability.py tests/test_copilot.py

      - name: Publish Assessment Report to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: always()
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- mcp-maltego-pr-eval -->';
            let reportContent = '';
            
            try {
              reportContent = fs.readFileSync('pr-report.md', 'utf8');
            } catch (err) {
              reportContent = '## ⚠️ Error al generar el informe de evaluación\nNo se pudo leer `pr-report.md`.';
            }
            
            const body = `${marker}\n${reportContent}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

