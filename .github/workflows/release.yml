name: Release

# Se ejecuta al publicar una release en GitHub (tag vX.Y.Z):
#  1. verifica que la versión del tag coincide con package.json / pyproject.toml / server.json y pasa los tests
#  2. publica el paquete en GitHub Packages como @data-unix/mcp-maltego (sección "Packages" del repo)
#  3. publica en npmjs.com como mcp-maltego: con el secreto NPM_TOKEN (primera vez) o con Trusted Publishing
#     (variable de repo NPM_TRUSTED_PUBLISHING=true); provenance si el repo es público
#  4. publica server.json en el registro oficial de MCP si la variable MCP_REGISTRY_PUBLISH=true
#  5. adjunta el .tgz del paquete npm, el wheel y el sdist de Python a la release
# Cada publicación se omite si esa versión ya existe, así que se puede relanzar sin errores.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Check versions
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME no coincide con package.json $PKG"; exit 1
          fi
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm test

  github-packages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@data-unix"
      - name: Publish @data-unix/mcp-maltego (si la versión no existe ya)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          npm pkg set name="@data-unix/mcp-maltego"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm pkg delete publishConfig.access
          if npm view "@data-unix/mcp-maltego@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@data-unix/mcp-maltego@$VERSION ya está en GitHub Packages"; exit 0
          fi
          npm publish

  npmjs:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing (OIDC) y provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (necesario para Trusted Publishing)
        run: npm install -g npm@^11.5.1
      - name: Publish mcp-maltego to npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "mcp-maltego@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::mcp-maltego@$VERSION ya está publicado en npmjs.com"; exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$TRUSTED" != "true" ]; then
            echo "::warning::Ni NPM_TOKEN ni NPM_TRUSTED_PUBLISHING=true: se omite npmjs.com"; exit 0
          fi
          if [ "$TRUSTED" = "true" ]; then unset NODE_AUTH_TOKEN; fi   # OIDC: npm lo detecta solo
          FLAGS="--access public"
          if [ "$IS_PRIVATE" != "true" ]; then FLAGS="$FLAGS --provenance"; fi
          npm publish $FLAGS

  mcp-registry:
    needs: npmjs
    if: vars.MCP_REGISTRY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # login github-oidc
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install mcp-publisher (versión fijada)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry \
            --pattern "mcp-publisher_linux_amd64.tar.gz" --output publisher.tar.gz
          tar xzf publisher.tar.gz mcp-publisher
      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  assets:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm pack
      - run: uv build --wheel --sdist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mcp-maltego-*.tgz dist/* --clobber
