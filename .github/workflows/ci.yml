name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  npm:
    name: npm package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm test
      - name: Pack and install like a user
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/mcp-maltego-*.tgz
          npx mcp-maltego --version
          npx mcp-maltego doctor

  security:
    name: Security (secrets + dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lee la lista de commits del PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # todo el historial: los secretos borrados siguen en git
          persist-credentials: false
      - name: Gitleaks (secretos en todo el historial)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit (vulnerabilidades conocidas en dependencias Python)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: npm package contents (sin ficheros sensibles)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const names = /(^|\/)(\.env|\.npmrc|\.pypirc|local\.settings\.json|transforms\.toml|graph\.json|__pycache__)/;
            const exts = /\.(pem|key|p12|pfx|crt|mtgx|mtz|graphml|csv|log)$/;
            const bad = files.filter(f => names.test(f) || exts.test(f));
            if (bad.length) { console.error('Ficheros prohibidos en el paquete:', bad); process.exit(1); }
            console.log(files.length + ' ficheros en el paquete, ninguno sensible');"
