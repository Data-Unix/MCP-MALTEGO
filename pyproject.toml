[project]
name = "maltego-mcp"
version = "0.2.0"
description = "Servidor MCP para delegar en agentes LLM flujos de Maltego y análisis de grafos OSINT"
readme = "README.md"
license = "MIT"
authors = [{ name = "Data-Unix" }]
keywords = ["mcp", "maltego", "osint", "threat-intelligence", "link-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "maltego-trx>=1.6",
]

[project.urls]
Homepage = "https://github.com/Data-Unix/MCP-MALTEGO"
Issues = "https://github.com/Data-Unix/MCP-MALTEGO/issues"
Changelog = "https://github.com/Data-Unix/MCP-MALTEGO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gremlin = ["gremlinpython>=3.7"]

[project.scripts]
maltego-mcp = "maltego_mcp.server:main"
maltego-mcp-bridge = "maltego_mcp.maltego.bridge:main"
maltegoctl = "maltego_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maltego_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gremlin_python.*", "maltego_trx.*"]
ignore_missing_imports = true
